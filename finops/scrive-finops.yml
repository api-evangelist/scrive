meters:
- name: user_seats
  description: Licensed user seats on an eSign Online plan, billed per user per month.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - user_group
- name: documents_sent
  description: Documents/envelopes sent for electronic signing.
  unit: documents
  aggregation: sum
  dimensions:
  - account
  - user_group
  - user
- name: eid_transactions
  description: e-ID authentication and QES signing transactions (BankID, MitID, Freja, Smart-ID, etc.), often billed per transaction on higher-volume agreements.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - eid_method
- name: api_calls
  description: Document API calls, governed by the per-user-group rate limit rather than direct per-call billing.
  unit: requests
  aggregation: sum
  dimensions:
  - user_group
principles:
- name: Visibility
  description: Track seats, documents sent, and e-ID transactions per user group so cost maps to teams and workflows.
- name: Allocation
  description: Organize users into user groups and folders per business unit so document and e-ID spend is attributable.
- name: Optimization
  description: Reuse templates to cut preparation overhead, right-size seat counts, and select e-ID methods appropriate to the assurance level actually required to avoid unnecessary per-transaction cost.
- name: Accountability
  description: Assign owners per user group; review seat utilization and monthly document/e-ID volume against the subscription and any volume agreement.
