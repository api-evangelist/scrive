description: >-
  FinOps view of Scrive spend. Scrive eSign Online is sold as seat-based
  subscriptions (per user per month, typically billed annually), with the
  Document API and e-ID transactions layered on the Business and Enterprise
  tiers or as separate volume-based agreements. The dominant cost drivers are
  the number of user seats, the volume of documents/envelopes sent for signing,
  and e-ID authentication transactions (BankID, MitID, Freja, Smart-ID, etc.),
  each of which can carry a per-transaction charge in higher-volume agreements.
notes: >-
  Per-envelope and per-e-ID transaction rates are not publicly reconciled here;
  they are typically quoted by Scrive sales for Business/Enterprise and API
  agreements. Verify on the pricing and get-started-api pages.
