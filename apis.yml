aid: scrive
url: https://raw.githubusercontent.com/api-evangelist/scrive/refs/heads/main/apis.yml
name: Scrive
kind: company
description: Scrive is a Nordic e-signature and digital identity (e-ID) platform for
  agreeing, signing, and verifying documents online. The Scrive Document API (eSign
  Online, Version 2) is a RESTful, JSON-over-HTTPS interface that creates, prepares,
  sends, and manages the full lifecycle of documents for electronic signing, with
  identity verification through Nordic and European e-ID methods including Swedish,
  Norwegian, and Finnish BankID, Danish MitID, Freja, and Smart-ID. Authentication
  uses OAuth2, OAuth 1.0, or personal access credentials; document status changes
  are delivered to consumers via HTTP callback (webhook) URLs. A separate Scrive eID
  Hub provides standalone identity authentication and signing.
