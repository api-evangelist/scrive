aid: scrive
name: Scrive
review:
  question: Does Scrive expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Scrive's public API surface (the Document
    API Version 2 and the eID Hub) is request/response REST over HTTPS. The only
    server-initiated transport is document status callbacks, which Scrive
    delivers as outbound HTTP POST requests to a consumer-configured
    api_callback_url (a webhook), not as a WebSocket or SSE stream. Webhooks are
    a server-to-endpoint HTTP push, out of scope for an AsyncAPI streaming
    document here.
findings:
  summary: |
    Scrive does not publish a documented public WebSocket API. Scrive is a Nordic
    e-signature and digital identity (e-ID) platform. Its primary public API is
    the Scrive Document API (eSign Online, Version 2), a RESTful JSON-over-HTTPS
    interface at base https://scrive.com/api/v2 (production) or
    https://api-testbed.scrive.com/api/v2 (testbed), authenticated with OAuth2,
    OAuth 1.0, or personal access credentials. A separate Scrive eID Hub
    (eid.scrive.com) provides standalone e-ID authentication and signing. All of
    these are pure request/response REST. Asynchronous notification of document
    status changes is delivered by an outbound HTTP POST callback (webhook) to a
    configured api_callback_url when a document becomes pending, closed,
    canceled, timedout, or rejected - with automatic retries. No realtime,
    bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented anywhere on Scrive's API.
  openSource: |
    Scrive is a commercial SaaS; the Document API and eID Hub are proprietary,
    hosted services. Scrive does maintain a public GitHub organization
    (github.com/scrive) with open-source Haskell libraries and tooling, but the
    e-signature/e-ID product APIs themselves are not open source or
    self-hostable.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://scrive.com/api/v2
      documented: true
      note: Scrive Document API Version 2. Testbed base is https://api-testbed.scrive.com/api/v2.
    - protocol: REST
      scheme: https
      baseURL: https://eid.scrive.com
      documented: true
      note: Scrive eID Hub - standalone e-ID authentication and signing (BankID, MitID, Freja, etc.).
    - protocol: Webhook
      scheme: https
      documented: true
      note: Document status callbacks are delivered as outbound HTTP POST to a configured api_callback_url. Server-to-endpoint HTTP push, retried up to 10 times, not a WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Scrive's Document API or eID Hub as of the review date.
