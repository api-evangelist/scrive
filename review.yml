sources:
  - url: https://apidocs.scrive.com/
    type: Documentation
    note: Scrive Document API Version 2 reference - base URLs, OAuth2/OAuth1/personal-credentials auth, all document/template/signing/attachment/callback/access-control endpoints, e-ID methods, 20k/hour rate limit, and callback (webhook) behavior. All REST; no WebSocket.
  - url: https://eid.scrive.com/documentation/api/v1/
    type: Documentation
    note: Scrive eID Hub - standalone e-ID authentication/signing API. REST.
  - url: https://www.scrive.com/get-started-api
    type: Documentation
    note: Getting started with the Scrive API.
  - url: https://www.scrive.com/pricing/esign-online
    type: Pricing
    note: eSign Online seat-based subscription plans (Free Trial, Essential, Business, Enterprise).
  - url: https://github.com/scrive
    type: SourceCode
    note: Scrive's public GitHub org (open-source Haskell libraries/tooling); the product e-sign/e-ID APIs are proprietary SaaS, not here.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Scrive's public API is request/response
    REST (Document API Version 2 and the eID Hub), and its only server-initiated
    async transport is outbound HTTP POST callbacks (webhooks) to a
    consumer-configured api_callback_url. No AsyncAPI document was created because
    there is no WebSocket or SSE stream on Scrive's own API to model.
